{% extends "master/base.html" %}
{% block body %}


<h2>Register Now</h2>

<form action="" method="POST">
    {% csrf_token %}
  <label for="fname">Full Name</label>
  <input type="text" id="fname" name="full_name" placeholder="Your name..">

  <label for="lname">User Name</label>
  <input type="text" id="lname" name="username" placeholder="Your last name..">

  <label for="country">User Type</label>
  <select id="country" name="usertype">
    <option value="usertype">usertype</option>
    <option value="admin">Admin</option>
    <option value="user">User</option>
  </select>

  <label for="lname">Password</label>
  <input type="password" id="lname" name="password" placeholder="Your last name..">

  <label for="lname">Confirm Password</label>
  <input type="password" id="lname" name="con_password" placeholder="Your last name..">

  <label for="lname">Email</label>
  <input type="email" id="lname" name="email" placeholder="Your last name..">
  
  <input type="submit" value="Submit">
</form>


{% endblock body %}

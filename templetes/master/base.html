<!DOCTYPE html>
<html>
<head>
<style>
/* -------- Global -------- */
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
  margin: 0;
  padding: 0;
  background-color: #f9fafb;
  color: #333;
}

/* -------- Navbar -------- */
ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  background-color: #ffffff;
  border-bottom: 1px solid #e5e7eb;
}

ul li a {
  display: block;
  padding: 14px 20px;
  text-decoration: none;
  color: #374151;
  font-weight: 500;
}

ul li a:hover {
  background-color: #f3f4f6;
  color: #111827;
}

/* -------- Headings -------- */
h2 {
  margin: 20px 0;
  font-weight: 600;
}

/* -------- Form -------- */
form {
  max-width: 600px;
  margin: 30px auto;
  background: #ffffff;
  padding: 25px;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
}

input,
textarea,
select {
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 15px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background-color: #ffffff;
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: #3b82f6;
}

/* -------- Button -------- */
button,
input[type="submit"] {
  width: 100%;
  padding: 12px;
  background-color: #3b82f6;
  border: none;
  color: white;
  font-size: 15px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover,
input[type="submit"]:hover {
  background-color: #2563eb;
}

/* -------- Table -------- */
table {
  width: 95%;
  margin: 30px auto;
  border-collapse: collapse;
  background-color: #ffffff;
  border: 1px solid #e5e7eb;
}

th,
td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #e5e7eb;
}

th {
  background-color: #f3f4f6;
  font-weight: 600;
}

tr:hover {
  background-color: #f9fafb;
}


</style>
</head>
<body>

{% include "master/nav.html" %}
{% block body %}

{% endblock body %}





</body>
</html>

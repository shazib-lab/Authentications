{% extends "master/base.html" %}
{% block body %}


<h1>Department List</h1>

<a href="{% url 'addDepartment' %}">Add New Department</a>
<table>
  <tr>
    <th>SL</th>
    <th>Name</th>
    <th>Location</th>
    <th>Action</th>
  </tr>
  {% for i in dep_data %}
  <tr>
    <td>{{forloop.counter}}</td>
    <td>{{i.name}}</td>
    <td>{{i.location}}</td>
    <td>
      <a href="{% url 'edite_department' i.id %}">Edit</a>
      <a href="{% url 'delete_department' i.id %}" onclick="return confirm('Are you sure?')">Delete</a>
    </td>
  </tr>
    {% endfor %}
  </table>
{% endblock body %}
